# Push and pull request to main/dev: commit messages (Conventional Commits), lint, type check, unit tests (+ reports).
# Push to main only, after all checks: semantic release (tag vX.Y.Z + GitHub Release, if commits warrant one)
# and the image ghcr.io/<owner>/<repo>:<commit sha> (+ :vX.Y.Z when a release was made).
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit messages
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # first push of a branch has no "before": lint just the pushed commit
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then FROM="$TO~1"; fi
          npx --yes -p @commitlint/cli@21 -p @commitlint/config-conventional@21 \
            commitlint --from "$FROM" --to "$TO" --verbose

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run type-check
      - name: Unit tests with coverage (JUnit -> reports/junit.xml)
        run: npm run test:ci 2>&1 | tee test-output.txt  # bash -o pipefail: a test failure still fails the step
      - name: Coverage summary
        if: always()
        run: |
          { echo '### Coverage'; echo '```'; sed -n '/Coverage summary/,/^====/p' test-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: reports/
          retention-days: 14
      - run: npm run build-only

  # README badges "tests" and "coverage": shields.io endpoint JSON, force-pushed to the orphan branch `badges`
  # (main only; CI does not run on that branch). No external service, no extra token.
  badges:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: reports
      - name: Badge JSON from the coverage and JUnit reports
        run: |
          mkdir badges
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          def badge(name, label, message, color):
              with open(f'badges/{name}.json', 'w') as f:
                  json.dump({'schemaVersion': 1, 'label': label, 'message': message, 'color': color}, f)

          pct = json.load(open('reports/coverage/coverage-summary.json'))['total']['lines']['pct']
          color = next(c for limit, c in ((90, 'brightgreen'), (80, 'green'), (70, 'yellowgreen'), (60, 'yellow'),
                                          (0, 'red')) if pct >= limit)
          badge('coverage', 'coverage', f'{pct:.0f}%', color)

          root = ET.parse('reports/junit.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root)
          total = sum(int(s.get('tests', 0)) for s in suites)
          bad = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
          badge('tests', 'tests', f'{total - bad} passed' if not bad else f'{bad} failed', 'red' if bad else 'brightgreen')
          PY
          cat badges/*.json
      - name: Push to the badges branch
        working-directory: badges
        run: |
          git init -q -b badges
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m 'chore: badges'
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [commits, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tag + GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}  # a branch, not a detached HEAD: semantic release needs it
          fetch-depth: 0
      - name: Release exactly the tested commit, even if main moved on meanwhile
        run: git reset --hard ${{ github.sha }}
      - id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          config_file: releaserc.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: false  # version lives in git tags, nothing is committed back to main
          tag: true
          push: true
          changelog: false
          vcs_release: true

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ needs.release.outputs.released == 'true' && format('ghcr.io/{0}:v{1}', github.repository, needs.release.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
